[package]
name = "recipio"
version = "0.1.0"
description = "A local-first desktop recipe app"
authors = ["bvdon"]
license = "MIT"
repository = "https://github.com/bvdon/recipio"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "recipio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
thiserror = "2.0.21"
log = "0.4.34"
chrono = "0.4.45"
uuid = { version = "1.28.0", features = ["v4"] }
ts-rs = "12.0.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-log = "2.10.1"
http = "1.5.0"
percent-encoding = "2.3.2"
sha2 = "0.11.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tar = "0.4.46"
fs4 = "1.1.0"
futures-util = "0.3.34"
xz2 = { version = "0.1.7", features = ["static"] }
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "macros", "time", "fs", "rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "gzip", "brotli", "cookies"] }
scraper = "0.29"
url = "2.5.8"
encoding_rs = "0.8.42"
keepawake = "0.6.1"
krilla = "0.8.2"
rustybuzz = "0.20.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
